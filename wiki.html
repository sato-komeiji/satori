<!doctype html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Welcome to satori's space</title>
        <!-- Load external CSS styles -->
        <link rel="stylesheet" href="styles.css">
        <style>
            * {
            box-sizing: border-box;
            }
            html {
            background: url("https://cdn.pixabay.com/photo/2025/05/30/14/10/cubes-9631570_1280.jpg");
            background-size: 67%;
            background-attachment: fixed;
            background-repeat: repeat;
            background-color: rgba(60, 21, 60, 0.703);
            font-family: "Trebuchet MS", sans-serif;
            margin: 0;
            padding: 0;
            }
            h2 {
            color: black;
            display: block;
            }
            body {
            display: flex;
            min-height: 95vh;
            margin: 2vh 2vw;
            gap: 2vw;
            }
            main {
            flex: 4;
            background-color: rgb(64, 30, 94);
            color: white;
            font-size: 1.2em;
            padding: 2em;
            border: 5px solid darkcyan;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-radius: 10px;
            }
            nav {
            flex: 1;
            display: block;
            background-color: bisque;
            color: black;
            padding: 2em;
            border: 5px solid darkcyan;
            border-radius: 10px;
            }
            #title {
            text-align: center;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 1em;
            }
            primary {
            background-color: bisque;
            width: 67%;
            margin: 0 auto;
            border: 1px solid black;
            color: black;
            font-size: 0.67em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            border-radius: 0;
            display: block;
            }
            article {
            background-color: lightcyan;
            width: 67%;
            margin: 0 auto;
            border: 1px solid black;
            color: black;
            font-size: 0.67em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            border-radius: 0;
            display: block;
            }
            primary windowtitle {
            background-color: darkred;
            font-weight: bold;
            display: inline-block;
            width: 100%;
            color: white;
            }
            article windowtitle {
            background-color: pink;
            font-weight: bold;
            display: inline-block;
            width: 100%;
            color: darkred;
            }
            text {
            display: inline-block;
            padding: 0.41%;
            }
            a, a:visited {
            color: black;
            text-decoration: none;
            display: inline;
            }
            a:hover, a:visited:hover {
            color: darkcyan;
            text-decoration: underline;
            }
            iframe {
            padding-left: 2.1%;
            }
            @media (max-width: 1300px) {
            body {
            flex-direction: column;
            }
            main,
            nav {
            flex: none;
            width: 100%;
            margin: 1em 0;
            }
            }
            h2{
            color: black;
            margin: none;
            padding: 0.5em;
            display: inline;
            width: 100%;
            }
            article img{
            display: inline;
            padding: 1em;
            }
        </style>
    </head>
    <body>
        <main>
            <header id="title">
                <br><br>
                <img class="symbol" src="https://www.spriters-resource.com/media/asset_icons/48/50643.png?updated=1755472998">
                <h1>Satori's Wiki</h1>
            </header>
            <div id="text-body">
                <article>
                    <windowtitle>
                        <text>
                            Welcome to the Wiki!
                        </text>
                    </windowtitle>
                    <text>
                        <b>This is a place where you can explore Sato's r/ related things.</b><br>
                        <i>Links:</i><br>
                        <a href="pll.html">My PLL Sheet</a><a><br>
                        </a><a href="axis.html">Axis Systems</a>
                    </text>
                </article>
            </div>
            <!-- Load external JavaScript -->
            <script src="scripts.js"></script>
        </main>
        <nav>
            <a href="index.html">Home</a><br>
            <a href="wiki.html">Wiki</a>
        </nav>
    </body>
</html>
